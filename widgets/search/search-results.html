<div class="search-results-head">
  <h1 class="search-results-title">Search results</h1>
  <form class="search-results-form" method="get" role="search">
    <label class="visually-hidden" for="search-results-q">Search</label>
    <input id="search-results-q" type="text" name="q" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <p class="search-results-count" aria-live="polite"></p>
</div>
<ol class="search-results-list"></ol>
